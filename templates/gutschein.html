<h1>Geschenkgutschein</h1>

<label>Betrag</label>

<select id="gutschein-betrag">
    <option value="10">10 €</option>
    <option value="25">25 €</option>
    <option value="50">50 €</option>
    <option value="100">100 €</option>
</select>

<div id="paypal-button-container"></div>

<script src="https://www.paypal.com/sdk/js?client-id=DEIN_CLIENT_ID&currency=EUR"></script>

<script>
function getBetrag() {
    return document.getElementById("gutschein-betrag").value;
}

paypal.Buttons({

    createOrder: function () {
        const betrag = getBetrag();

        return fetch("/create-paypal-order", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                is_gutschein: true,
                betrag: betrag
            })
        })
        .then(res => res.json())
        .then(data => data.id);
    },

    onApprove: function (data) {
        return fetch(`/capture-paypal-order/${data.orderID}`, {
            method: "POST"
        })
        .then(res => res.json())
        .then(result => {
            if (result.status === "success") {
                window.location.href = "/danke";
            } else {
                alert("Zahlung fehlgeschlagen");
            }
        });
    }

}).render("#paypal-button-container");
</script>
