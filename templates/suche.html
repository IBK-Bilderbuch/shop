<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Impressum | I B K - Buchhandlung für Illustration und Bilderbücher</title>

  <link rel="icon" type="image/x-icon" href="static/ficon.png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='script.js') }}" defer></script>
  

  
</head>

  {% include 'navbar.html' %}

<div id="navbar-placeholder"></div>
  

<div class="search-page">
  <h1>Finde Dein Buch</h1>

  <form action="{{ url_for('suche') }}" method="POST" class="search-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="text" name="q" placeholder="Buchname eingeben..." required>
    <button type="submit"><i class="fas fa-search"></i>suchen</button>
  </form>

  {% if query %}
    <h3>Suchergebnisse für "{{ query }}":</h3>

    {% if ergebnisse %}

        {% include 'produkte_liste.html' %}

    {% else %}
      <p>Keine Ergebnisse gefunden.</p>
    {% endif %}
  {% endif %}
</div>

{% include 'footer.html' %}

</html>
